<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="inicio.secion.css">
</head>
<body>
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5">
            <div class="login">
                <h1 class="fw-bold mb-4">Reseñas de Películas</h1>
                <h3 class="mb-4">Crear cuenta</h3>
<form id="registroForm">
  <div>
  <label for="nombre" class="form-label">Ingrese su nombre de usuario:</label>
  <input class="form-control" type="text" id="nombre" placeholder="ingrese su nombre de usuario" aria-label="Default input example">
  </div>
  <div>
  <label for="contraseña" class="form-label">Ingrese su contraseña:</label>
  <input class="form-control mb-3" type="password" id="contraseña" placeholder="ingrese su contraseña" aria-label="Default input example">
  </div>
   <div class="form-field">
  <label for="gmail" class="form-label">Correo electrónico</label>
  <input class="form-control mb-3" type="email" class="form-control" id="gmail" placeholder="name@example.com">
  </div> 
   
  
  <div>
  <label for="edad" class="form-label">Ingrese su edad:</label>
  <input class="form-control mb-3" type="number" id="edad" placeholder="ingrese su edad" aria-label="Default input example">
  </div>

  <br>
  <button type="submit" class="btn btn-danger w-100 py-2 fw-bold rounded-pill">Registrarse</button>
  <p class="mt-3">
    ¿Ya tenés cuenta?
  <a href="inicio.sesion.html" class="text-danger">Iniciar sesión</a>
  <p id="mensaje"></p>
 

</form>
            </div>
        </div>
    </div>
</div>
<script src="registro.js"></script>
</body>
</html>
