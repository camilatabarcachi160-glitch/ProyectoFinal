<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+" crossorigin="anonymous"></script>
    
</head>
<body>
<p><center>Bienvenido al registro de usuarios!</center></p> 

<br>    
<div style="max-width: 450px;" class="mx-auto">
<form id="registroForm">
  <div>
  <label for="nombre" class="form-label">Ingrese su nombre de usuario:</label>
  <input class="form-control" type="text" id="nombre" placeholder="ingrese su nombre de usuario" aria-label="Default input example">
  </div>
  <div>
  <label for="contraseña" class="form-label">Ingrese su contraseña:</label>
  <input class="form-control" type="password" id="contraseña" placeholder="ingrese su contraseña" aria-label="Default input example">
  </div>
   <div class="form-field">
  <label for="gmail" class="form-label">Email address</label>
  <input type="email" class="form-control" id="gmail" placeholder="name@example.com">
  </div> 
   
  
  <div>
  <label for="edad" class="form-label">Ingrese su edad:</label>
  <input class="form-control" type="number" id="edad" placeholder="ingrese su edad" aria-label="Default input example">
  </div>

  <br>
  <center><button type="submit" class="btn btn-primary">Registrarse</button></center>
  <center><p>¿Ya tenés cuenta? <a href="inicio.sesion.html">Iniciar sesión</a></p></center>
  <br>
  <p id="mensaje"></p>
 



</form>
</div>
<script src="registro.js"></script>
</body>
</html>
